<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTALL NET - Benif RFD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(20, 26, 38, 0.85);
            border: 2px solid #ff3333; /* Color acentuado para resaltar */
            padding: 45px 35px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.2);
            max-width: 480px;
            width: 90%;
        }

        h1 {
            font-size: 2.4rem;
            color: #ff3333;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 800;
        }

        p {
            font-size: 1.3rem;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 35px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-download {
            display: inline-block;
            background: #ff3333;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4);
            border: 2px solid transparent;
        }

        .btn-download:hover {
            background: #e02828;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.6);
        }

        .btn-download:active {
            transform: translateY(-1px);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #5d6d7e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>INSTALL NET</h1>
        
        <p>.NET MAKES RFD WORK!</p>
        
        <a href="https://dotnet.microsoft.com/es-es/download/dotnet/thank-you/sdk-10.0.300-windows-x64-installer" class="btn-download" target="_blank">
            DOWNLOAD
        </a>

        <div class="footer-note">
            Official Microsoft .NET SDK Installer x64
        </div>
    </div>

</body>
</html>
